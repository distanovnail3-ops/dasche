<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Даша, с годовщиной ♡</title>
  <meta name="description" content="один оч большой кот приготовил для тя surprise babe">

  <link rel="stylesheet" href="style.css">

<body>
  <main id="experience" aria-label="Сюрприз для Даши">
    <div id="scene" role="img" aria-label="Большой объёмный серый Пушин"></div>
    <header><span class="dedication">für Dascha <b>♡</b></span><button id="sound" class="icon-button" aria-label="Выключить звук" aria-pressed="false" title="Звук">♫</button></header>
    <section class="intro" id="intro"><p class="eyebrow">ОПААААА</p><h1>Даша.....</h1><p>кажется, у него есть что-то для тебя.</p></section>
    <div id="greeting" aria-live="polite" aria-hidden="true"><span>ДАШАААА!</span><h2>С ГОДОВЩИНОООЙ<span class="heart">♡</span></h2></div>
    <div id="bubble" role="status"></div>
    <footer><div id="start-panel"><button class="primary" id="start">Подойти к Пушину <span>♡</span></button><p class="hint" id="hint"></p></div><div id="end-panel" hidden><p class="love">15 месяцев с самой лучшей девочкой!:3</p><div id="photo-controls" class="photo-controls" role="group" aria-label="Фотографии" hidden><button id="photo-prev" aria-label="Предыдущая фотография">‹</button><div id="photo-dots" class="photo-dots"></div><span id="photo-count" class="photo-count" aria-live="polite">1 / 4</span><button id="photo-next" aria-label="Следующая фотография">›</button><button id="photo-pause" aria-label="Приостановить смену фотографий" aria-pressed="false">Ⅱ</button></div><button id="replay" class="replay">Ещё раз? ↻</button></div><span class="tiny"></span></footer>
    <button id="music-retry" class="primary retry" hidden>Включить нашу песню ♫</button>
    <div id="error" hidden>Не удалось включить 3D. Попробуй открыть сайт в другом браузере.</div>
  </main>
  <noscript><p class="noscript">Включи JavaScript, чтобы Пушин мог показать сюрприз.</p></noscript>
  <audio id="song" src="assets/song.mp3" preload="auto"></audio>
  <script type="module" src="app.js"></script>
